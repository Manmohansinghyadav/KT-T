<!DOCTYPE html>
<html>
<head>
    <title>Invoice Bill Maker</title>
     <!-- Browser Tab Logo -->
    <link rel="icon" type="image/png" href="KT&T BGR.png">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- AutoTable (VERY IMPORTANT) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body{
    font-family: Arial;
    padding:20px;
    background:#f4f4f4;
}

/* Inputs + Buttons */
input,button{
    padding:10px;
    margin:5px;
    font-size:14px;
}

/* Default Desktop Layout */
button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

/* Table */
table{
    width:100%;
    border-collapse: collapse;
    background:white;
    margin-top:20px;
}

th,td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

/* Preview */
#previewBox{
    margin-top:30px;
    padding:20px;
    background:white;
    border:2px solid black;
    display:none;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 768px){

    body{
        padding:10px;
    }

    h2{
        font-size:20px;
        text-align:center;
    }

    /* Inputs Full Width */
    input{
        width:95%;
        display:block;
        margin:8px auto;
        font-size:16px;
    }

    /* Buttons Full Width */
    button{
        width:95%;
        display:block;
        margin:8px auto;
        font-size:16px;
    }

    /* Table Scroll */
    table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

    /* Preview Box */
    #previewBox{
        padding:12px;
    }

    #previewBox img{
        width:90px;
    }

    #previewBox h2{
        font-size:18px;
    }

    #previewBox h3{
        font-size:16px;
    }
}

    </style>
</head>

<body>

<h2>Invoice Bill Maker</h2>

<input type="text" id="passenger" placeholder="Passenger Name">
<input type="text" id="route" placeholder="Route Details">
<input type="number" id="price" placeholder="Route Price">

<br>

<button onclick="addEntry()">Add Route</button>
<button onclick="showPreview()">Preview Invoice</button>
<button onclick="generatePDF()">Generate PDF</button>

<table>
<thead>
<tr>
<th>Route No</th>
<th>Passenger</th>
<th>Route</th>
<th>Price</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<h3 id="totalAmount">Total : 0</h3>

<!-- PREVIEW AREA -->
<div id="previewBox">

    <div style="text-align:center">
        <img src="logo.png" width="120">
        <h2>KRISHNA TOURS AND TRAVEL</h2>
        <h3>RECEIPT / INVOICE</h3>
    </div>

    <p id="previewDate"></p>
    <p id="previewPassenger"></p>

    <table>
        <thead>
            <tr>
                <th>Route</th>
                <th>Details</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="previewTable"></tbody>
    </table>

    <h3 id="previewTotal"></h3>

    <p style="margin-top:20px;">
    THANK YOU FOR CHOOSING KRISHNA TOURS AND TRAVELS<br>
    Contact : 7457011613<br>
    <!-- HR38ABJ8203 (Maruti Suzuki Ertiga) -->
    </p>

</div>

<script>

let routes = [];
let vehicleNumber = "HR38ABJ8203 (Maruti Suzuki Ertiga)";

// ADD ENTRY
function addEntry(){

    let passenger = document.getElementById("passenger").value;
    let route = document.getElementById("route").value;
    let price = document.getElementById("price").value;

    if(!passenger || !route || !price){
        alert("Fill all fields");
        return;
    }

    // Ask Vehicle Number Only Once
    if(vehicleNumber === ""){
        vehicleNumber = prompt("Enter Vehicle Number");
        if(!vehicleNumber) vehicleNumber = "N/A";
    }

    routes.push({
        passenger,
        route,
        price:Number(price)
    });

    updateTable();

    document.getElementById("passenger").value="";
    document.getElementById("route").value="";
    document.getElementById("price").value="";
}

// UPDATE TABLE
function updateTable(){

    let body = document.getElementById("tableBody");
    body.innerHTML="";

    let total=0;

    routes.forEach((r,i)=>{
        total += r.price;

        body.innerHTML += `
        <tr>
            <td>Route ${i+1}</td>

            <td contenteditable="true"
                onblur="updateCell(${i}, 'passenger', this.innerText)">
                ${r.passenger}
            </td>

            <td contenteditable="true"
                onblur="updateCell(${i}, 'route', this.innerText)">
                ${r.route}
            </td>

            <td contenteditable="true"
                onblur="updateCell(${i}, 'price', this.innerText)">
                ${r.price}
            </td>
        </tr>`;
    });

    document.getElementById("totalAmount").innerText="Total : "+total;
}

function updateCell(index, field, value){

    if(field === "price"){
        value = Number(value);
        if(isNaN(value)) value = 0;
    }

    routes[index][field] = value;

    updateTable();
}



// PREVIEW
function showPreview(){

    if(routes.length === 0){
        alert("Add at least one route");
        return;
    }

    document.getElementById("previewBox").style.display = "block";

    let today = new Date().toLocaleDateString();
    document.getElementById("previewDate").innerText = "Date : " + today;

    document.getElementById("previewPassenger").innerHTML =
        "Passenger : " + routes[0].passenger +
        "<br>Vehicle No : " + vehicleNumber;

    let table = document.getElementById("previewTable");
    table.innerHTML = "";

    let total = 0;

    routes.forEach((r,i)=>{
        total += r.price;

        table.innerHTML += `
        <tr>
            <td>Route ${i+1}</td>
            <td>${r.route}</td>
            <td>${r.price}</td>
        </tr>`;
    });

    document.getElementById("previewTotal").innerText =
        "TOTAL AMOUNT : " + total;
}

// PDF GENERATE
function generatePDF(){

    if(routes.length === 0){
        alert("Add at least one route");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let img = new Image();
    img.src = "logo.png";

    img.onload = function(){

        // LOGO
        doc.addImage(img, "PNG", 85, 10, 40, 25);

        // HEADER
        doc.setFontSize(16);
        doc.text(
            "KRISHNA TOURS AND TRAVEL",
            doc.internal.pageSize.getWidth() / 2,
            45,
            { align: "center" }
        );

       doc.setFontSize(14);
        doc.text(
            "RECEIPT / INVOICE",
            doc.internal.pageSize.getWidth() / 2,
            55,
            { align: "center" }
        );


        // DATE
        let today = new Date().toLocaleDateString();
        doc.text("Date : " + today, 20, 70);

        // PASSENGER + VEHICLE
        doc.text("Passenger : " + routes[0].passenger, 20, 80);
        doc.text("Vehicle No : " + vehicleNumber, 20, 88);

        // TABLE DATA
        let tableData = [];
        let total = 0;

        routes.forEach((r,i)=>{
            total += r.price;
            tableData.push([
                "Route " + (i+1),
                r.route,
                r.price
            ]);
        });

        // TABLE
        doc.autoTable({
            startY: 100,
            head: [["Route", "Details", "Price"]],
            body: tableData
        });

        // TOTAL RIGHT SIDE
        let finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(14);
        doc.text(
            "TOTAL AMOUNT : " + total,
            200,
            finalY,
            { align: "right" }
        );

        // THANK YOU CENTER
        doc.setFontSize(11);
        doc.text(
            "THANK YOU FOR CHOOSING KRISHNA TOURS AND TRAVELS",
            105,
            270,
            { align: "center",
              maxWidth: 200
             }
        );

        doc.setFont("helvetica", "bold");
        doc.text(
            "Contact :" + " 7457011613",
            105,
            278,
            { align: "center"}
        );

        doc.save("Invoice.pdf");
    };

    img.onerror = function(){
        alert("Logo not found. Put logo.png in same folder.");
    };
}

</script>


</body>
</html>
